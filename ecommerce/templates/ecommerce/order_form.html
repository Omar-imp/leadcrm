{% extends 'ecommerce/base.html' %}
{% block title %}{{ title }} - E-commerce CRM{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>

<div style="display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;">

    <div class="card" style="flex:1; min-width:500px; max-width:700px;">
        <h3 style="margin-top:0;">Order Details</h3>
        <form method="post" id="order-form">
            {% csrf_token %}

            <div style="margin-bottom:16px;">
                <label class="field-label">Customer <span class="required">*</span></label>
                <select name="customer" required class="form-control">
                    <option value="">-- Select Customer --</option>
                    {% for c in customers %}
                    <option value="{{ c.id }}">{{ c.name }} ({{ c.email|default:c.phone }})</option>
                    {% endfor %}
                </select>
            </div>

            <div style="margin-bottom:16px;">
                <label class="field-label">Status</label>
                <select name="status" class="form-control">
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="draft">Draft</option>
                </select>
            </div>

            <hr style="border:none; border-top:1px solid var(--border); margin:20px 0;">

            <label class="field-label">Order Items</label>
            <div id="item-rows"></div>
            <button type="button" class="btn btn-small" onclick="addItemRow()" style="margin-top:8px;">+ Add Product</button>

            <hr style="border:none; border-top:1px solid var(--border); margin:20px 0;">

            <div class="form-row" style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">
                <div>
                    <label class="field-label">Discount</label>
                    <input type="number" step="0.01" name="discount" id="id_discount" class="form-control" value="0" oninput="updateTotals()">
                </div>
                <div>
                    <label class="field-label">Tax</label>
                    <input type="number" step="0.01" name="tax" id="id_tax" class="form-control" value="0" oninput="updateTotals()">
                </div>
                <div>
                    <label class="field-label">Shipping Cost</label>
                    <input type="number" step="0.01" name="shipping_cost" id="id_shipping_cost" class="form-control" value="0" oninput="updateTotals()">
                </div>
            </div>

            <div class="form-actions" style="margin-top:20px;">
                <button type="submit" class="btn">Create Order</button>
            </div>
        </form>
    </div>

    <div class="card" style="flex:1; min-width:320px; max-width:380px;">
        <h3 style="margin-top:0;">Order Summary</h3>
        <div style="margin-bottom:14px;">
            <div class="stat" style="text-align:left;">
                <div class="label">Subtotal</div>
                <div class="value" id="summary_subtotal" style="font-size:22px;">Rs 0.00</div>
            </div>
        </div>
        <div style="margin-bottom:14px;">
            <div class="stat" style="text-align:left;">
                <div class="label">Total (after discount, tax, shipping)</div>
                <div class="value" id="summary_total" style="font-size:26px;">Rs 0.00</div>
            </div>
        </div>
    </div>

</div>

<script>
const PRODUCTS = [
    {% for p in products %}
    { id: {{ p.id }}, name: "{{ p.name|escapejs }}", price: {{ p.sale_price }}, stock: {{ p.stock_qty }} },
    {% endfor %}
];

let rowCount = 0;

function addItemRow() {
    rowCount++;
    const container = document.getElementById('item-rows');
    const row = document.createElement('div');
    row.id = 'row-' + rowCount;
    row.style = 'display:flex; gap:10px; align-items:center; margin-bottom:10px;';

    let options = '<option value="">-- Select Product --</option>';
    PRODUCTS.forEach(p => {
        options += `<option value="${p.id}" data-price="${p.price}">${p.name} (Rs ${p.price}, stock: ${p.stock})</option>`;
    });

    row.innerHTML = `
        <select name="product" class="form-control" style="flex:2;" onchange="updateTotals()">${options}</select>
        <input type="number" name="quantity" value="1" min="1" class="form-control" style="flex:1;" oninput="updateTotals()">
        <button type="button" class="btn btn-small" onclick="document.getElementById('row-${rowCount}').remove(); updateTotals();">Remove</button>
    `;
    container.appendChild(row);
}

function updateTotals() {
    let subtotal = 0;
    document.querySelectorAll('#item-rows > div').forEach(row => {
        const select = row.querySelector('select[name="product"]');
        const qtyInput = row.querySelector('input[name="quantity"]');
        const selectedOption = select.options[select.selectedIndex];
        const price = selectedOption ? parseFloat(selectedOption.dataset.price || 0) : 0;
        const qty = parseFloat(qtyInput.value) || 0;
        subtotal += price * qty;
    });

    const discount = parseFloat(document.getElementById('id_discount').value) || 0;
    const tax = parseFloat(document.getElementById('id_tax').value) || 0;
    const shipping = parseFloat(document.getElementById('id_shipping_cost').value) || 0;
    const total = subtotal - discount + tax + shipping;

    document.getElementById('summary_subtotal').textContent = 'Rs ' + subtotal.toFixed(2);
    document.getElementById('summary_total').textContent = 'Rs ' + total.toFixed(2);
}

// start with one row by default
addItemRow();
</script>
{% endblock %}

{% extends 'ecommerce/base.html' %}
{% block title %}{{ title }} - E-commerce CRM{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>

<div style="display:flex; gap:24px; align-items:flex-start; flex-wrap:wrap;">

    <div class="card" style="flex:1; min-width:400px; max-width:600px;">
        <h3 style="margin-top:0;">Payment Details</h3>
        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom:16px;">
                <label class="field-label">Order <span class="required">*</span></label>
                <select name="order" id="id_order" required class="form-control" onchange="updateOrderInfo()" {% if order %}disabled{% endif %}>
                    <option value="">-- Select Order --</option>
                    {% for o in orders %}
                    <option value="{{ o.id }}" data-total="{{ o.total }}" {% if order and order.id == o.id %}selected{% endif %}>
                        {{ o.order_number }} — {{ o.customer.name }} (Rs {{ o.total }})
                    </option>
                    {% endfor %}
                </select>
                {% if order %}<input type="hidden" name="order" value="{{ order.id }}">{% endif %}
            </div>
            <div style="margin-bottom:16px;">
                <label class="field-label">Method</label>
                <select name="method" class="form-control">
                    <option value="cash">Cash</option>
                    <option value="bank_transfer">Bank Transfer</option>
                    <option value="stripe">Stripe</option>
                    <option value="paypal">PayPal</option>
                    <option value="cod">COD</option>
                </select>
            </div>
            <div style="margin-bottom:16px;">
                <label class="field-label">Status</label>
                <select name="status" class="form-control">
                    <option value="paid">Paid</option>
                    <option value="partial">Partial</option>
                    <option value="pending">Pending</option>
                    <option value="refunded">Refunded</option>
                </select>
            </div>
            <div style="margin-bottom:16px;">
                <label class="field-label">Amount <span class="required">*</span></label>
                <input type="number" step="0.01" name="amount" id="id_amount" required class="form-control" oninput="updateRemaining()">
            </div>
            <div class="form-actions">
                <button type="submit" class="btn">Record Payment</button>
            </div>
        </form>
    </div>

    <div class="card" style="flex:1; min-width:320px; max-width:380px;">
        <h3 style="margin-top:0;">Order Summary</h3>
        <div style="margin-bottom:14px;">
            <div class="stat" style="text-align:left;">
                <div class="label">Order Total</div>
                <div class="value" id="order_total" style="font-size:22px;">Rs 0.00</div>
            </div>
        </div>
        <div style="margin-bottom:14px;">
            <div class="stat" style="text-align:left;">
                <div class="label">Remaining After This Payment</div>
                <div class="value" id="order_remaining" style="font-size:26px;">Rs 0.00</div>
            </div>
        </div>
    </div>

</div>

<script>
function updateOrderInfo() {
    const select = document.getElementById('id_order');
    const selected = select.options[select.selectedIndex];
    const total = selected ? parseFloat(selected.dataset.total || 0) : 0;
    document.getElementById('order_total').textContent = 'Rs ' + total.toFixed(2);
    updateRemaining();
}

function updateRemaining() {
    const select = document.getElementById('id_order');
    const selected = select.options[select.selectedIndex];
    const total = selected ? parseFloat(selected.dataset.total || 0) : 0;
    const amount = parseFloat(document.getElementById('id_amount').value) || 0;
    const remaining = total - amount;
    document.getElementById('order_remaining').textContent = 'Rs ' + remaining.toFixed(2);
}

{% if order %}
updateOrderInfo();
{% endif %}
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raabta 360 — CRM Solutions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 60px;
        }
        .header h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }
        .header p {
            font-size: 18px;
            opacity: 0.9;
        }
        .crm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 32px;
            justify-content: center;
        }
        .crm-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }
        .crm-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .crm-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        .crm-card h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 12px;
        }
        .crm-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .crm-button {
            display: inline-block;
            padding: 12px 32px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }
        .crm-button:hover {
            background: #5568d3;
        }
        .crm-card:nth-child(2) .crm-button {
            background: #764ba2;
        }
        .crm-card:nth-child(2) .crm-button:hover {
            background: #653a85;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Raabta 360</h1>
            <p>Choose your CRM solution</p>
        </div>

        <div class="crm-grid">
            <div class="crm-card">
                <div class="crm-icon">✈️</div>
                <h2>Lead CRM</h2>
                <p>Manage leads, follow-ups, meetings, and quotations for services and travel businesses.</p>
                <a href="{% url 'login' %}" class="crm-button">Login to Lead CRM</a>
            </div>

            <div class="crm-card">
                <div class="crm-icon">🛍️</div>
                <h2>E-commerce CRM</h2>
                <p>Manage products, orders, customers, inventory, and shipments for online stores.</p>
                <a href="{% url 'ecommerce_login' %}" class="crm-button">Login to E-commerce CRM</a>
            </div>
        </div>
    </div>
</body>
</html>

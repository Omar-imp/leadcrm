{% extends 'leads/base.html' %}
{% block title %}{{ title }} - Lead CRM{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
<div class="form-card">
    <div class="form-card-header"><h2>{{ title }}</h2></div>
    <div class="form-card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">Name <span class="required">*</span></label>
                    <input type="text" name="name" class="form-control" required
                           value="{{ spo.name|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Link to User Account</label>
                    <select name="user" class="form-control">
                        <option value="">-- No User --</option>
                        {% for u in users %}
                        <option value="{{ u.pk }}"
                            {% if spo.user_id == u.pk %}selected{% endif %}>
                            {{ u.username }} ({{ u.get_full_name|default:u.username }})
                        </option>
                        {% endfor %}
                    </select>
                    <small style="color:var(--text-muted);">
                        Link to a user account so leads assigned to this SPO
                        appear on their dashboard.
                    </small>
                </div>
            </div>
            <div class="form-actions">
                <a href="{% url 'salesperson_list' %}"
                   style="margin-right:12px; padding:12px 20px; color:#666;">Cancel</a>
                <button type="submit" class="btn">
                    {% if spo %}Save Changes{% else %}Add Sales Person{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

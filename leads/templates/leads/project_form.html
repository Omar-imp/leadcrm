{% extends 'leads/base.html' %}
{% block title %}{{ title }} - Lead CRM{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
<div class="form-card">
    <div class="form-card-header"><h2>{{ title }}</h2></div>
    <div class="form-card-body">
        <form method="post" novalidate>
            {% csrf_token %}

            {% if opportunity %}
            <input type="hidden" name="opportunity" value="{{ opportunity.pk }}">
            <div class="alert alert-success">
                Converting opportunity: <strong>{{ opportunity.title }}</strong>
            </div>
            {% endif %}

            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">Project Name <span class="required">*</span></label>
                    <input type="text" name="name" class="form-control" required
                           value="{% if project.name %}{{ project.name }}{% elif opportunity %}{{ opportunity.title }}{% endif %}">
                </div>
                <div class="form-group">
                    <label class="field-label">Status</label>
                    <select name="status" class="form-control">
                        {% for value, label in status_choices %}
                        <option value="{{ value }}"
                            {% if project.status == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Priority</label>
                    <select name="priority" class="form-control">
                        {% for value, label in priority_choices %}
                        <option value="{{ value }}"
                            {% if project.priority == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Methodology</label>
                    <select name="methodology" class="form-control">
                        {% for value, label in methodology_choices %}
                        <option value="{{ value }}"
                            {% if project.methodology == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Budget</label>
                    <input type="number" name="budget" class="form-control"
                           value="{% if project.budget %}{{ project.budget }}{% elif opportunity %}{{ opportunity.value }}{% else %}0{% endif %}">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Start Date</label>
                    <input type="date" name="start_date" class="form-control"
                           value="{{ project.start_date|date:'Y-m-d'|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">End Date</label>
                    <input type="date" name="end_date" class="form-control"
                           value="{{ project.end_date|date:'Y-m-d'|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Estimated Hours</label>
                    <input type="number" name="estimated_hours" class="form-control"
                           value="{{ project.estimated_hours|default:'0' }}">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Project Manager</label>
                    <select name="manager" class="form-control">
                        <option value="">-- None --</option>
                        {% for u in users %}
                        <option value="{{ u.pk }}"
                            {% if project.manager_id == u.pk %}selected{% endif %}>
                            {{ u.username }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Company</label>
                    <select name="company" class="form-control">
                        <option value="">-- None --</option>
                        {% for c in companies %}
                        <option value="{{ c.pk }}"
                            {% if project.company_id == c.pk %}selected
                            {% elif opportunity.company_id == c.pk %}selected{% endif %}>
                            {{ c.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Technology Stack</label>
                    <input type="text" name="technology_stack" class="form-control"
                           placeholder="e.g. Django, React, PostgreSQL"
                           value="{{ project.technology_stack|default:'' }}">
                </div>
            </div>

            <div class="form-group" style="margin-bottom:22px;">
                <label class="field-label">Team Members</label>
                <select name="team" class="form-control" multiple
                        style="height:120px;">
                    {% for u in users %}
                    <option value="{{ u.pk }}"
                        {% if u in project.team.all %}selected{% endif %}>
                        {{ u.username }}
                    </option>
                    {% endfor %}
                </select>
                <small style="color:var(--text-muted);">Hold Cmd (Mac) to select multiple</small>
            </div>

            <div class="form-group" style="margin-bottom:22px;">
                <label class="field-label">Description</label>
                <textarea name="description" class="form-control" rows="3">{% if project.description %}{{ project.description }}{% elif opportunity %}{{ opportunity.description }}{% endif %}</textarea>
            </div>

            <div class="form-group" style="margin-bottom:22px;">
                <label class="field-label">Notes</label>
                <textarea name="notes" class="form-control" rows="3">{{ project.notes|default:'' }}</textarea>
            </div>

            <div class="form-actions">
                <a href="{% url 'project_list' %}"
                   style="margin-right:12px; padding:12px 20px; color:#666;">Cancel</a>
                <button type="submit" class="btn">
                    {% if project %}Save Changes{% else %}Create Project{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

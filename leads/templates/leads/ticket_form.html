{% extends 'leads/base.html' %}
{% block title %}{{ title }} - Lead CRM{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
<div class="form-card">
    <div class="form-card-header"><h2>{{ title }}</h2></div>
    <div class="form-card-body">
        <form method="post" novalidate>
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Title <span class="required">*</span></label>
                    <input type="text" name="title" class="form-control" required
                           value="{{ ticket.title|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Category</label>
                    <select name="category" class="form-control">
                        {% for value, label in category_choices %}
                        <option value="{{ value }}"
                            {% if ticket.category == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Priority</label>
                    <select name="priority" class="form-control">
                        {% for value, label in priority_choices %}
                        <option value="{{ value }}"
                            {% if ticket.priority == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Status</label>
                    <select name="status" class="form-control">
                        {% for value, label in status_choices %}
                        <option value="{{ value }}"
                            {% if ticket.status == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Assign To</label>
                    <select name="assigned_to" class="form-control">
                        <option value="">-- Unassigned --</option>
                        {% for u in users %}
                        <option value="{{ u.pk }}"
                            {% if ticket.assigned_to_id == u.pk %}selected{% endif %}>
                            {{ u.username }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Company</label>
                    <select name="company" class="form-control">
                        <option value="">-- None --</option>
                        {% for c in companies %}
                        <option value="{{ c.pk }}"
                            {% if ticket.company_id == c.pk %}selected{% endif %}>
                            {{ c.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">Lead</label>
                    <select name="lead" class="form-control">
                        <option value="">-- None --</option>
                        {% for l in leads %}
                        <option value="{{ l.pk }}"
                            {% if ticket.lead_id == l.pk %}selected{% endif %}>
                            {{ l.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Project</label>
                    <select name="project" class="form-control">
                        <option value="">-- None --</option>
                        {% for p in projects %}
                        <option value="{{ p.pk }}"
                            {% if ticket.project_id == p.pk %}selected{% endif %}>
                            {{ p.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="form-group" style="margin-bottom:22px;">
                <label class="field-label">Description <span class="required">*</span></label>
                <textarea name="description" class="form-control" rows="5"
                          required>{{ ticket.description|default:'' }}</textarea>
            </div>

            <div class="form-actions">
                <a href="{% url 'ticket_list' %}"
                   style="margin-right:12px; padding:12px 20px; color:#666;">Cancel</a>
                <button type="submit" class="btn">
                    {% if ticket %}Save Changes{% else %}Create Ticket{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% extends 'leads/base.html' %}
{% block title %}{{ title }} - Lead CRM{% endblock %}
{% block content %}
<h1 class="page-title">{{ title }}</h1>
<div class="form-card">
    <div class="form-card-header"><h2>{{ title }}</h2></div>
    <div class="form-card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Company Name <span class="required">*</span></label>
                    <input type="text" name="name" class="form-control" required
                           value="{{ company.name|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Industry</label>
                    <select name="industry" class="form-control">
                        <option value="">-- Select Industry --</option>
                        {% for value, label in industry_choices %}
                        <option value="{{ value }}"
                            {% if company.industry == value %}selected{% endif %}>
                            {{ label }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label class="field-label">Website</label>
                    <input type="url" name="website" class="form-control"
                           placeholder="https://example.com"
                           value="{{ company.website|default:'' }}">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="field-label">Email</label>
                    <input type="email" name="email" class="form-control"
                           value="{{ company.email|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Phone</label>
                    <input type="text" name="phone" class="form-control"
                           value="{{ company.phone|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">City</label>
                    <input type="text" name="city" class="form-control"
                           value="{{ company.city|default:'' }}">
                </div>
            </div>
            <div class="form-row" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                    <label class="field-label">Country</label>
                    <input type="text" name="country" class="form-control"
                           value="{{ company.country|default:'' }}">
                </div>
                <div class="form-group">
                    <label class="field-label">Address</label>
                    <input type="text" name="address" class="form-control"
                           value="{{ company.address|default:'' }}">
                </div>
            </div>
            <div class="form-group" style="margin-bottom:22px;">
                <label class="field-label">Notes</label>
                <textarea name="notes" class="form-control" rows="3">{{ company.notes|default:'' }}</textarea>
            </div>
            <div class="form-actions">
                <a href="{% url 'company_list' %}" style="margin-right:12px; padding:12px 20px; color:#666;">Cancel</a>
                <button type="submit" class="btn">{% if company %}Save Changes{% else %}Add Company{% endif %}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
